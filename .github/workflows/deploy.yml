name: Build, Deploy & Rollback CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_sha: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to AlmaLinux VPS with Automatic Rollback
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          script: |
            set -e

            APP_DIR="/var/www/quizbuzz-ops-next"
            NEW_IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

            echo "🚀 Starting Deployment for Image: ${NEW_IMAGE}"
            mkdir -p ${APP_DIR}
            cd ${APP_DIR}

            # 1. Capture current running image for rollback capability
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' quizbuzz-ops-app 2>/dev/null || echo "")
            echo "ℹ️  Current Running Image: ${CURRENT_IMAGE:-None}"

            # 2. Login to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin

            # 3. Pull target new image
            echo "📥 Pulling image from GHCR..."
            docker pull ${NEW_IMAGE}

            # 4. Run Prisma database migrations against AWS RDS
            echo "🗄️ Executing Prisma Database Migrations..."
            if [ -f .env.production ]; then
              docker run --rm \
                --env-file .env.production \
                ${NEW_IMAGE} npx prisma migrate deploy || echo "⚠️ Migration completed or skipped."
            fi

            # 5. Deploy new image
            echo "🔄 Updating container..."
            export DOCKER_IMAGE=${NEW_IMAGE}
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate

            # 6. Perform Health Check Verification Loop (10 attempts, 5s delay)
            echo "🩺 Performing health check probes on http://127.0.0.1:3010/api/health ..."
            HEALTH_PASSED=false
            for i in {1..10}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/api/health || echo "000")
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "✅ Health check PASSED on attempt ${i} (HTTP 200)"
                HEALTH_PASSED=true
                break
              fi
              echo "⏳ Attempt ${i}/10 failed (HTTP status: ${HTTP_STATUS}). Retrying in 5 seconds..."
              sleep 5
            done

            # 7. Rollback if Health Check Failed
            if [ "$HEALTH_PASSED" = false ]; then
              echo "❌ ERROR: Health check FAILED! Initiating automatic rollback..."
              if [ -n "$CURRENT_IMAGE" ]; then
                echo "⏪ Rolling back to previous image: ${CURRENT_IMAGE}"
                export DOCKER_IMAGE=${CURRENT_IMAGE}
                docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate
                echo "⚠️ Rollback executed successfully. Previous working version restored."
              else
                echo "⚠️ No previous working image found to roll back to."
              fi
              exit 1
            fi

            # 8. Prune old/unused images after verified deployment
            echo "🧹 Pruning old unused images on VPS..."
            docker image prune -af --filter "until=24h" || true

            echo "🎉 Deployment SUCCESSFULLY completed!"
