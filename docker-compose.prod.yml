services:
  ops-redis:
    image: redis:7-alpine
    container_name: quizbuzz-ops-redis
    restart: unless-stopped
    ports:
      - "7015:6379"
    networks:
      - quizbuzz-net

  ops-app:
    image: ${DOCKER_IMAGE:-ghcr.io/ysmsoftware/quizbuzz-ops:latest}
    container_name: quizbuzz-ops-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OPS_DATABASE_URL=${OPS_DATABASE_URL}
      - MAIN_DATABASE_URL=${MAIN_DATABASE_URL}
      - REDIS_URL=redis://ops-redis:6379
      - OPS_JWT_ACCESS_SECRET=${OPS_JWT_ACCESS_SECRET}
      - OPS_JWT_REFRESH_SECRET=${OPS_JWT_REFRESH_SECRET}
      - OPS_ALLOWED_ORIGINS=${OPS_ALLOWED_ORIGINS:-https://ops.ysmquizbuzz.com}
      - MAIN_APP_FRONTEND_URL=${MAIN_APP_FRONTEND_URL:-https://ysmquizbuzz.com}
      # NOTE: NEXT_PUBLIC_MAIN_APP_URL is intentionally NOT set here — it's a
      # build-time-only value (see Dockerfile ARG), listing it as a runtime
      # env var here would be a no-op and misleadingly suggest it's fixable
      # without a rebuild.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - OTP_EXPIRY_MINUTES=${OTP_EXPIRY_MINUTES:-5}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-${EMAIL_FROM}}
      - BILLING_HANDOFF_SECRET=${BILLING_HANDOFF_SECRET}
      - OPS_COOKIE_DOMAIN=${OPS_COOKIE_DOMAIN}
    depends_on:
      - ops-redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quizbuzz-net

  ops-worker:
    image: ${DOCKER_IMAGE:-ghcr.io/ysmsoftware/quizbuzz-ops:latest}
    container_name: quizbuzz-ops-worker
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      - NODE_ENV=production
      - OPS_DATABASE_URL=${OPS_DATABASE_URL}
      - MAIN_DATABASE_URL=${MAIN_DATABASE_URL}
      - REDIS_URL=redis://ops-redis:6379
      - OPS_JWT_ACCESS_SECRET=${OPS_JWT_ACCESS_SECRET}
      - OPS_JWT_REFRESH_SECRET=${OPS_JWT_REFRESH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-${EMAIL_FROM}}
      - BILLING_HANDOFF_SECRET=${BILLING_HANDOFF_SECRET}
    depends_on:
      - ops-redis
    networks:
      - quizbuzz-net

networks:
  quizbuzz-net:
    external: true
    name: quizbuzz-new_default
