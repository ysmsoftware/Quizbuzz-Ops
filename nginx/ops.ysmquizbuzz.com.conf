# -----------------------------------------------------------------------------
# Nginx Server Block Configuration for AlmaLinux VPS
# Domain: ops.ysmquizbuzz.com
# File Location: /etc/nginx/conf.d/ops.ysmquizbuzz.com.conf
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name ops.ysmquizbuzz.com;

    # Redirect HTTP traffic to HTTPS (uncomment after obtaining Certbot SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        
        # Header configurations for proxying requests & WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable cache for API & SSE responses
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint passthrough
    location /api/health {
        proxy_pass http://127.0.0.1:3010/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

